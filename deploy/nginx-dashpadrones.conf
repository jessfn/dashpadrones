# Sitio: https://dashpadrones.sembrandodatos.com  (ver /etc/nginx/sites-enabled/dashpadrones-sembrandodatos)
# La parte que importa: el frontend es estático y /api/ va al backend FastAPI.
server {
    listen 443 ssl;
    server_name dashpadrones.sembrandodatos.com;
    # ssl_certificate ... (certbot)

    root /var/www/dashpadrones.sembrandodatos.com;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
